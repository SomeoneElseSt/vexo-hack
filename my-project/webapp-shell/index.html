<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vexo records</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="side-top">
        <span class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">Vexo</span>
        </span>
        <button class="icon-btn collapse" id="collapse" title="Collapse sidebar" aria-label="Collapse sidebar">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <nav class="nav" id="nav">
        <button class="nav-item" data-view="overview">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="3" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="14" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="14" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
          <span>Overview</span>
        </button>
        <button class="nav-item" data-view="records">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span>Records</span>
        </button>
        <button class="nav-item" data-view="export">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 19h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Export</span>
        </button>
        <button class="nav-item" data-view="settings">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10l2 2M5 19l2-2m10-10l2-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span>Settings</span>
        </button>
      </nav>
      <div class="side-foot">
        <button class="icon-btn expand" id="expand" title="Expand sidebar" aria-label="Expand sidebar" hidden>
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <h1 class="page-title" id="page-title">Overview</h1>
        <div class="topbar-right">
          <span class="device-id muted small" id="device-id"></span>
          <span class="status" id="status" data-state="decrypting">
            <span class="dot" aria-hidden="true"></span>
            <span class="status-label">Decrypting…</span>
          </span>
        </div>
      </header>
      <p class="status-hint" id="status-hint" hidden></p>

      <main class="content" id="content"></main>
    </div>
  </div>

  <footer class="foot">
    <span>Self-hosted · your records stay sealed to your device</span>
    <span class="muted" id="foot-device"></span>
  </footer>

  <script src="/static/unlock.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
