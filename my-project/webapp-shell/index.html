<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vexo records</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="side-top">
        <span class="brand">Vexo</span>
        <button class="icon-btn" id="toggle" title="Collapse sidebar" aria-label="Collapse sidebar" aria-expanded="true"><span class="chevron">‹</span></button>
      </div>
      <nav class="nav" id="nav">
        <button class="nav-item" data-view="overview" title="Overview"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><rect x="3" y="3" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="14" y="3" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="3" y="14" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="14" y="14" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span>Overview</span></button>
        <button class="nav-item" data-view="records" title="Records"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>Records</span></button>
        <button class="nav-item" data-view="visits" title="Visits"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 9.5h17M8 3v4M16 3v4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>Visits</span></button>
        <button class="nav-item" data-view="medications" title="Medications"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M10.6 4.6a4.2 4.2 0 0 1 5.9 0l2.9 2.9a4.2 4.2 0 0 1 0 5.9l-6 6a4.2 4.2 0 0 1-5.9 0l-2.9-2.9a4.2 4.2 0 0 1 0-5.9z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m7.6 7.6 8.8 8.8" stroke="currentColor" stroke-width="1.6"/></svg><span>Medications</span></button>
        <button class="nav-item" data-view="export" title="Export"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 19h16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Export</span></button>
        <button class="nav-item" data-view="settings" title="Settings"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 3v3m0 12v3M3 12h3m12 0h3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>Settings</span></button>
      </nav>
    </aside>

    <div class="main">
      <header class="topbar">
        <h1 class="page-title" id="page-title">Overview</h1>
        <div class="topbar-right">
          <span class="status" id="status" data-state="decrypting" hidden>
            <span class="dot" aria-hidden="true"></span>
            <span class="status-label">Decrypting…</span>
          </span>
        </div>
      </header>
      <p class="status-hint" id="status-hint" hidden></p>

      <main class="content" id="content"></main>
    </div>
  </div>

  <script src="/static/unlock.js"></script>
  <script src="/static/body.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
